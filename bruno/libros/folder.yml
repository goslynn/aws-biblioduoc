docs: |
  # libros

  El catalogo de la biblioteca, en la tabla `libro` de PostgreSQL. Lo siembra
  la migracion Flyway `V2__catalogo_inicial.sql`. Desde aqui solo se **lee**:
  el stock (`ejemplares`) cambia al aprobar, devolver y cargar, y eso vive en
  la carpeta `gestion` (empleados). El rol de la aplicacion solo puede
  actualizar esa columna; titulo, autor o ISBN no se tocan desde la API.

  ## Avisame cuando vuelva

  Ante un libro con 0 ejemplares, un estudiante se suscribe
  (`subscribe`). Cuando una carga de stock o una devolucion lo deja con
  ejemplares, sale un correo por cada suscrito, por RabbitMQ (cola de correo
  **masivo**), y su suscripcion se cierra. Solo reciben correo quienes
  activaron los avisos (carpeta `avisos`).

  ## Modelo

  ```json
  {
    "id": "L-001",
    "titulo": "Clean Code",
    "autor": "Robert C. Martin",
    "genero": "Informatica",
    "anio": 2008,
    "isbn": "978-0132350884",
    "ejemplares": 4,
    "ubicacion": "Estante A-1",
    "sinopsis": "…",
    "disponible": true
  }
  ```

  `disponible` es un campo **calculado** por el backend (`ejemplares > 0`): asi
  la regla vive en un solo sitio y el frontend no la repite.

  ## Reglas

  - Los ids van de `L-001` a `L-020`.
  - `ejemplares: 0` significa que el titulo existe pero no se puede prestar:
    pedirlo devuelve **409**, no 404.
  - Todos los metodos exigen el scope `biblioteca-api/acceso`.
