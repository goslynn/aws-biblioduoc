info:
  name: bandeja-vivo
  type: http
  seq: 7

http:
  method: GET
  url: "{{BASE_URL}}/api/gestion/bandeja-vivo"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const esperado = Number(bru.getEnvVar("ESPERADO_GESTION"));

        test("responde lo que corresponde a esta credencial", function () {
          expect(res.getStatus()).to.equal(esperado);
        });

        if (esperado === 200) {
          test("el total cuadra con el contador por sede", function () {
            const cuerpo = res.getBody();
            const suma = Object.values(cuerpo.porSede).reduce((a, b) => a + b, 0);
            expect(suma).to.equal(cuerpo.pendientes);
            expect(cuerpo.ultimas.length).to.be.at.most(10);
          });
        }

docs: |
  # Bandeja en vivo (H9, Kafka)

  `GET /api/gestion/bandeja-vivo`. Las solicitudes que siguen `RECIBIDA`,
  cuantas hay en cada sede y las 10 mas recientes, segun el consumer group
  `bandeja-gestion` leyendo el topico `biblioteca.solicitudes`. **No consulta
  la base**.

  La vista de gestion del navegador la llama cada pocos segundos: cuando
  llega una solicitud nueva aparece sin recargar, y al aprobarla o
  rechazarla desaparece.

  Como verlo cambiar: crea una solicitud (`solicitudes/create`, entorno
  `aws`) y ejecuta esta peticion con `aws-backoffice`; despues apruebala
  (`gestion/approve`) y vuelve a ejecutarla.

  ## Respuestas

  | Codigo | Cuando | Como reproducirlo aqui |
  |---|---|---|
  | 200 | empleado | entorno `aws-backoffice` |
  | 403 | token valido de un NO empleado: lo da Spring | entorno `aws` |
  | 401 | token invalido, id token o sin scope | entornos de 401 |

examples:
  - name: 200 bandeja
    request:
      url: "{{BASE_URL}}/api/gestion/bandeja-vivo"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "pendientes": 2,
            "porSede": { "SAN_JOAQUIN": 1, "PLAZA_OESTE": 1, "PUENTE_ALTO": 0, "VINA_DEL_MAR": 0, "CONCEPCION": 0 },
            "ultimas": [
              { "id": "SOL-0042", "sede": "PLAZA_OESTE", "ejemplares": 1,
                "titulos": ["Spring in Action"], "recibidaEn": "2026-11-23T15:21:10.004Z" },
              { "id": "SOL-0041", "sede": "SAN_JOAQUIN", "ejemplares": 2,
                "titulos": ["Clean Code", "Refactoring"], "recibidaEn": "2026-11-23T15:18:40.120Z" }
            ],
            "actualizadoEn": "2026-11-23T15:21:11.390Z"
          }
  - name: 403 no es empleado
    response:
      status: 403
      statusText: Forbidden
