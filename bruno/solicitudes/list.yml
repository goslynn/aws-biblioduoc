info:
  name: list
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/solicitudes"
  params:
    - name: mias
      value: "true"
      type: query
      disabled: true
      description: >-
        Se acepta por compatibilidad y ya no cambia nada: este endpoint
        devuelve SIEMPRE solo las solicitudes del portador del token. La
        bandeja completa es de empleados (gestion/list).
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const esperado = Number(bru.getEnvVar("ESPERADO_LECTURA"));

        test("responde lo que corresponde a esta credencial", function () {
          expect(res.getStatus()).to.equal(esperado);
        });

        if (esperado === 200) {
          test("devuelve una lista", function () {
            expect(res.getBody()).to.be.an("array");
          });

          test("todas son del portador del token", function () {
            const cuerpo = res.getBody();
            const solicitantes = new Set(cuerpo.map((s) => s.solicitante));
            expect(solicitantes.size).to.be.at.most(1);
          });
        }

docs: |
  # Listar mis solicitudes

  `GET /api/solicitudes`. Devuelve **solo las del portador del token** (el
  `sub` o `client_id` del JWT). Antes, sin parametros, devolvia todas: con
  RBAC, la bandeja completa paso a `GET /api/gestion/solicitudes`, solo para
  empleados.

  ## Parametros

  | Nombre | Tipo | Obligatorio | Descripcion |
  |---|---|---|---|
  | `mias` | query | no | aceptado por compatibilidad; no cambia el resultado |

  ## Respuestas

  | Codigo | Cuando | Como reproducirlo aqui |
  |---|---|---|
  | 200 | credencial con alguno de los scopes | entornos `aws` y `aws-backoffice` |
  | 401 | token invalido o id token | entornos `aws-token-invalido` / `aws-id-token` |
  | 401 | token valido sin el scope: el authorizer no distingue | entorno `aws-usuario-sin-scope` |

  ## Por que puede venir vacia

  Solo si el portador del token todavia no creo ninguna. Ejecuta `create` y
  despues este.

examples:
  - name: 200 con una solicitud
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          [
            {
              "id": "SOL-0001",
              "solicitante": "3n1k4kq9v8m2f7c0abcd1234",
              "estado": "RECIBIDA",
              "lineas": [ { "libroId": "L-001", "titulo": "Clean Code", "autor": "Robert C. Martin", "cantidad": 1 } ],
              "dias": 14,
              "motivo": "Material de apoyo para el proyecto de titulo",
              "sede": "SAN_JOAQUIN",
              "creadaEn": "2026-09-21T23:24:22.847991513Z",
              "fechaDevolucion": "2026-10-05"
            }
          ]
  - name: 200 lista vacia
    description: >-
      No es un error: todavia no se ha creado ninguna solicitud (o ninguna del
      portador del token, con mias=true).
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: "[]"
