opencollection: 1.0.0

info:
  name: biblioteca-api
  summary: >-
    API interna de la Biblioteca Duoc: catalogo de libros y solicitudes de
    prestamo, detras de API Gateway con authorizer de Cognito.
  version: 1.0.0

# Autenticacion declarada UNA sola vez. Todas las peticiones heredan
# (auth: inherit) y ninguna repite la cabecera Authorization a mano.
request:
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"
  headers:
    - name: Accept
      value: application/json

docs: |
  # biblioteca-api

  Catalogo de libros (solo lectura) y solicitudes de prestamo, guardados en
  PostgreSQL. Todo pasa por **API Gateway REST**, que valida el JWT con un
  authorizer de **Cognito** y exige el scope `biblioteca-api/acceso` en cada
  metodo. Detras hay un **Spring Boot sobre Lambda** que vuelve a validar el
  mismo token.

  ## La matriz de seguridad vive en los ENTORNOS

  Esta coleccion tiene **una request por endpoint**. Los 401, 403, 404 y 400 no
  son peticiones aparte: son el resultado de llamar al mismo endpoint **con otra
  credencial**, y una credencial es exactamente lo que define un entorno.

  Cada entorno declara, ademas del token, el codigo que esa credencial debe
  obtener (`ESPERADO_LECTURA` y `ESPERADO_CREACION`). Por eso `bru run` pasa en
  **verde en los seis casos**: la matriz completa, automatizada, sin duplicar ni
  una peticion.

  | Entorno | Credencial | Lecturas | Crear | Que demuestra |
  |---|---|---|---|---|
  | `aws` | cliente M2M con el custom scope | 200 | 201 | el camino completo funciona |
  | `aws-usuario-sin-scope` | access token de usuario (admin-initiate-auth) | 401 | 401 | un token valido al que le falta el scope |
  | `aws-id-token` | id token del mismo usuario | 401 | 401 | un id token no sirve para autorizar: no lleva claim `scope` |
  | `aws-token-invalido` | `no-es-un-jwt-de-verdad` | 401 | 401 | el authorizer valida la **firma**, no solo la presencia |

  **Codigos medidos, no supuestos.** La fila del token sin scope decia 403 sobre
  el papel. Medida contra el despliegue real, API Gateway responde **401**, con
  el mismo cuerpo que ante un token inventado: desde fuera **no distingue** "no
  se quien eres" de "se quien eres pero no puedes". El 403 por falta de
  autorizacion si existe, y lo emite **Spring Security** cuando se invoca la
  Lambda sin pasar por el gateway.

  ## Como se generan los entornos

  ```sh
  ./aws/pipeline/bruno-env.sh
  ```

  Lee los Outputs de CloudFormation, pide un token por cada caso y escribe
  `bruno/environments/aws*.yml`. Esos archivos **llevan tokens reales** y estan
  en `.gitignore`. Caducan a los 60 minutos: cuando veas 401 donde esperabas
  otra cosa, vuelve a ejecutarlo.

  ## Como se corre

  ```sh
  cd bruno
  bru run --env aws                     # 200 / 201   14/14 tests
  bru run --env aws-usuario-sin-scope   # 401          5/5  tests
  bru run --env aws-id-token            # 401          5/5  tests
  bru run --env aws-token-invalido      # 401          5/5  tests
  ```

  En NixOS, si OpenSSL se queja del directorio de certificados:
  `SSL_CERT_DIR=/etc/ssl/certs bru run --env aws`.

  ## El caso "sin cabecera Authorization"

  No tiene entorno propio: con un token vacio Bruno manda igualmente
  `Authorization: Bearer`, y API Gateway lo rechaza con el mismo 401. Para
  reproducir la ausencia total de cabecera, pon la pestana **Auth** de la
  peticion en *No Auth*.

bundled: false

extensions:
  bruno:
    ignore:
      - node_modules
      - .git
