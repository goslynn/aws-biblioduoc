  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const lectura = Number(bru.getEnvVar("ESPERADO_LECTURA"));
        const esperado = lectura === 200 ? 204 : lectura;

        test("responde lo que corresponde a esta credencial", function () {
          expect(res.getStatus()).to.equal(esperado);
        });

docs: |
  # Desactivar los avisos

  `DELETE /api/avisos/correo`. Borra el contacto: desde ese momento no sale
  ningun correo a esta persona. Los mensajes que ya estuvieran en las colas se
  descartan con ACK al no encontrar contacto. Idempotente.

  ## Respuestas

  | Codigo | Cuando | Como reproducirlo aqui |
  |---|---|---|
  | 204 | desactivados (o ya lo estaban) | entornos `aws` y `aws-backoffice` |
  | 401 | token invalido, id token o sin scope | entornos de 401 |

examples:
  - name: 204 desactivados
    response:
      status: 204
      statusText: No Content
