info:
  name: get
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/api/avisos/correo"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const esperado = Number(bru.getEnvVar("ESPERADO_LECTURA"));

        test("responde lo que corresponde a esta credencial", function () {
          expect(res.getStatus()).to.equal(esperado);
        });

        if (esperado === 200) {
          test("dice si los avisos estan activos", function () {
            expect(res.getBody().activo).to.be.a("boolean");
          });
        }

docs: |
  # Estado de los avisos

  `GET /api/avisos/correo` -> `{activo, email}`. `email` es `null` si los
  avisos no estan activos.

  ## Respuestas

  | Codigo | Cuando | Como reproducirlo aqui |
  |---|---|---|
  | 200 | credencial con alguno de los scopes | entornos `aws` y `aws-backoffice` |
  | 401 | token invalido, id token o sin scope | entornos de 401 |

examples:
  - name: 200 activos
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: '{ "activo": true, "email": "alumno@duoc.cl" }'
  - name: 200 sin activar
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: '{ "activo": false, "email": null }'
