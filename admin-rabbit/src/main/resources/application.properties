spring.application.name=biblioteca-admin-rabbit

# Puerto propio: en la EC2 corre al lado de la API (8080). Se publica solo
# hacia la VPC; desde fuera se llega por la VPN (aws/vpn.yaml).
server.port=8081

# Los 404 y 409 explican que paso; aqui no hay nada interno que esconder.
server.error.include-message=always

# ---------------------------------------------------------------------------
#  Seguridad: las MISMAS variables que la API (aws/backend.yaml las escribe
#  en el archivo de entorno de los dos contenedores). Ver ValidacionJwt.
#    BIBLIOTECA_ISSUER, BIBLIOTECA_JWKS, BIBLIOTECA_SCOPE, BIBLIOTECA_SCOPE_GESTION
# ---------------------------------------------------------------------------
biblioteca.scope-gestion=${BIBLIOTECA_SCOPE_GESTION}
biblioteca.grupo-empleados=empleados

# ---------------------------------------------------------------------------
#  RabbitMQ: los dos nodos del cluster (aws/backend/compose.yaml). Si uno cae,
#  el cliente se conecta al otro.
# ---------------------------------------------------------------------------
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# ---------------------------------------------------------------------------
#  Lo que este servicio NO puede borrar ni re-enlazar: la topologia que
#  declara la API (back/.../eventos/TopologiaRabbit.java). Si se agrega una
#  cola o un exchange alli, se agrega aqui.
# ---------------------------------------------------------------------------
admin.rabbit.protegidos=\
  biblioteca.eventos,eventos.dlx,\
  notif.prestamos,notif.disponibilidad,bitacora,\
  notif.prestamos.dlq,notif.disponibilidad.dlq,bitacora.dlq,\
  correo,correo.reintento,\
  correo.transaccional,correo.masivo,correo.espera,correo.fallidos
