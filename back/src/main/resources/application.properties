spring.application.name=biblioteca-backend

# Puerto por defecto de Spring Boot. Es tambien el que busca el Lambda Web
# Adapter (variable PORT en aws/backend.yaml), asi que no hay que cambiarlo.
server.port=8080

# NOTA sobre fechas: Spring Boot 4 usa Jackson 3, que ya serializa java.time
# como texto ISO-8601 ("2026-10-05T14:03:11Z") por defecto. La antigua
# propiedad spring.jackson.serialization.write-dates-as-timestamps ya no
# existe y, si se deja puesta, el contexto de Spring NI SIQUIERA ARRANCA.

# En un error, devolver el mensaje ayuda a diagnosticar desde Bruno y desde el
# navegador. En produccion real esto se apaga para no filtrar detalles internos.
server.error.include-message=always

# ---------------------------------------------------------------------------
#  Seguridad. Estos valores NO se escriben en el repositorio: los inyecta
#  aws/backend.yaml como variables de entorno de la Lambda, a partir de los
#  Outputs de cognito.yaml y web.yaml.
#
#    BIBLIOTECA_ISSUER  el emisor exigido en el claim "iss" (Cognito)
#    BIBLIOTECA_JWKS    las claves publicas de Cognito, en JSON; las descarga
#                       aws/pipeline/build-backend.sh porque la Lambda no tiene
#                       salida a Internet
#    BIBLIOTECA_SCOPE   el scope exigido
#    BIBLIOTECA_ORIGEN  el origen del frontend
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
#  Base de datos (PostgreSQL en RDS, privada). Tambien llega por variables de
#  entorno desde aws/backend.yaml, con las contrasenas resueltas desde Secrets
#  Manager (aws/database.yaml) al desplegar:
#
#    SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD   rol biblioteca_app: lo que
#                                                    usa la aplicacion
#    SPRING_FLYWAY_USER / _PASSWORD                  usuario maestro: SOLO para
#                                                    las migraciones al arrancar
#    BIBLIOTECA_APP_PASSWORD                         la misma de biblioteca_app,
#                                                    para que V1 cree el rol
# ---------------------------------------------------------------------------

# Pool pequeno: cada instancia de la Lambda atiende una peticion a la vez, y
# una db.t3.micro admite pocas conexiones. 5 instancias (ReservedConcurrency)
# x 2 conexiones queda muy lejos del limite.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

# Si la base no responde (por ejemplo, RDS todavia arrancando al reabrir el
# lab), fallar en 5 s con un error claro en vez de agotar los 30 s de la Lambda.
spring.datasource.hikari.connection-timeout=5000

# La contrasena del rol biblioteca_app, para el CREATE ROLE de V1. Se lee de
# una variable propia y no de SPRING_FLYWAY_PLACEHOLDERS_..., porque al pasar
# por una variable de entorno Spring pondria la clave del placeholder en
# minusculas ("apppassword") y Flyway ya no la encontraria.
spring.flyway.placeholders.appPassword=${BIBLIOTECA_APP_PASSWORD}
