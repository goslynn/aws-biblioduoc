spring.application.name=biblioteca-backend

# Puerto por defecto de Spring Boot. Es el que publica el contenedor en la EC2
# y al que apunta el target group del NLB (aws/backend.yaml).
server.port=8080

# NOTA sobre fechas: Spring Boot 4 usa Jackson 3, que ya serializa java.time
# como texto ISO-8601 ("2026-10-05T14:03:11Z") por defecto. La antigua
# propiedad spring.jackson.serialization.write-dates-as-timestamps ya no
# existe y, si se deja puesta, el contexto de Spring NI SIQUIERA ARRANCA.

# En un error 4xx, devolver el mensaje ayuda a diagnosticar desde Bruno y desde
# el navegador ("No existe el libro L-999"). En un 5xx NO se devuelve: lo
# reemplaza comun/.../AtributosDeError por uno generico, para no filtrar SQL,
# nombres de tablas o el ARN del rol del laboratorio.
server.error.include-message=always

# Al apagar (systemctl restart, docker compose down), Tomcat deja de aceptar
# peticiones y espera hasta 20 s a que terminen las que estan en curso. Docker
# espera 30 s antes de matar el contenedor (stop_grace_period en compose.yaml).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------------------------------------------------------------------------
#  Seguridad. Estos valores NO se escriben en el repositorio: salen del
#  parametro SSM AppConfig de aws/backend.yaml (con los Outputs de cognito.yaml
#  y web.yaml), y el script de arranque de la EC2 los deja en el archivo de
#  entorno del contenedor.
#
#    BIBLIOTECA_ISSUER          el emisor exigido en el claim "iss" (Cognito)
#    BIBLIOTECA_JWKS            las claves publicas de Cognito, en JSON; las
#                               descarga aws/pipeline/build-backend.sh
#    BIBLIOTECA_SCOPE           el scope de acceso (estudiantes)
#    BIBLIOTECA_SCOPE_GESTION   el scope del cliente M2M backoffice (empleado)
#    BIBLIOTECA_ORIGEN          el origen del frontend
#    BIBLIOTECA_USER_POOL_ID    el pool donde se lee el email verificado
# ---------------------------------------------------------------------------
biblioteca.scope-gestion=${BIBLIOTECA_SCOPE_GESTION}
biblioteca.cognito.user-pool-id=${BIBLIOTECA_USER_POOL_ID}

# El grupo de Cognito cuyos miembros son empleados (cognito.yaml).
biblioteca.grupo-empleados=empleados

# ---------------------------------------------------------------------------
#  Base de datos (PostgreSQL en RDS, privada). Tambien llega por variables de
#  entorno; las contrasenas las lee la EC2 de Secrets Manager (secretos de
#  aws/database.yaml) cada vez que arranca el contenedor:
#
#    SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD   rol biblioteca_app: lo que
#                                                    usa la aplicacion
#    SPRING_FLYWAY_USER / _PASSWORD                  usuario maestro: SOLO para
#                                                    las migraciones al arrancar
#    BIBLIOTECA_APP_PASSWORD                         la misma de biblioteca_app,
#                                                    para que V1 cree el rol
# ---------------------------------------------------------------------------

# Un solo proceso atiende peticiones, consumidores y tareas periodicas. 8
# conexiones alcanzan de sobra y quedan lejos del limite de una db.t3.micro.
spring.datasource.hikari.maximum-pool-size=8

# Si la base no responde (por ejemplo, RDS todavia arrancando al reabrir el
# lab), fallar en 5 s con un error claro en vez de colgar la peticion.
spring.datasource.hikari.connection-timeout=5000

# La contrasena del rol biblioteca_app, para el CREATE ROLE de V1. Se lee de
# una variable propia y no de SPRING_FLYWAY_PLACEHOLDERS_..., porque al pasar
# por una variable de entorno Spring pondria la clave del placeholder en
# minusculas ("apppassword") y Flyway ya no la encontraria.
spring.flyway.placeholders.appPassword=${BIBLIOTECA_APP_PASSWORD}

# Spring Data JDBC: el dialecto fijo, en vez de deducirlo abriendo una conexion
# al arrancar. Es el mismo motor en AWS (RDS) y en los tests (Testcontainers).
spring.data.jdbc.dialect=postgresql

# ---------------------------------------------------------------------------
#  RabbitMQ. Un cluster de DOS nodos en la MISMA EC2, en contenedores de la
#  misma red de compose (aws/backend/compose.yaml). RABBITMQ_ADDRESSES los
#  lista a los dos ("rabbitmq-1:5672,rabbitmq-2:5672"): si el primero no
#  responde, el cliente se conecta al segundo. Usuario y contrasena salen del
#  secreto RabbitSecret (aws/backend.yaml).
# ---------------------------------------------------------------------------
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Publisher confirms: el broker confirma cada publicacion. RelayEventos y
# PublicadorCorreo esperan esa confirmacion antes de dar algo por publicado.
spring.rabbitmq.publisher-confirm-type=simple

# ---------------------------------------------------------------------------
#  Correo (SMTP). El proveedor se elige al desplegar (SMTP_HOST...); la
#  contrasena sale del secreto SmtpSecret (aws/backend.yaml).
#  587 + STARTTLS obligatorio: el puerto 25 esta bloqueado en EC2, y sin TLS
#  la contrasena viajaria en claro.
# ---------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
biblioteca.correo.remitente=${SMTP_FROM}

# Reintentos del envio: max-intentos intentos, con una vuelta por correo.espera
# entre cada uno (3 intentos = 2 vueltas), que retiene el correo
# espera-reintento antes de devolverlo. OJO: espera-reintento es
# un argumento de la cola; cambiarlo con la cola ya creada hace fallar el
# arranque (PRECONDITION_FAILED) hasta borrarla. Ver aws/README.md §8.
biblioteca.correo.max-intentos=3
biblioteca.correo.espera-reintento=PT60S

# Recordatorio de vencimiento: cuanto antes avisar y cada cuanto revisar.
# BIBLIOTECA_RECORDATORIO_ANTELACION permite acortar la espera en una demo
# (por ejemplo PT23H58M: un prestamo de 1 dia avisa a los 2 minutos).
biblioteca.recordatorio.antelacion=${BIBLIOTECA_RECORDATORIO_ANTELACION:PT24H}
biblioteca.recordatorio.revision=PT1M

# Un hilo por tarea periodica (relay de RabbitMQ, relay de Kafka, topicos de
# Kafka, recordatorios). Con el hilo unico por defecto, un Kafka caido haria
# esperar al relay de RabbitMQ detras del suyo: los correos se atrasarian por
# culpa de un broker que no tiene nada que ver con ellos.
spring.task.scheduling.pool.size=4

# ---------------------------------------------------------------------------
#  Kafka. Tres brokers (y tres nodos Zookeeper) en la MISMA EC2, en
#  contenedores de la misma red de compose (aws/backend/kafka.compose.yaml).
#  KAFKA_BROKERS los lista a los tres ("kafka-1:9092,kafka-2:9092,kafka-3:9092",
#  AppConfig de aws/backend.yaml): el cliente descubre el cluster desde
#  cualquiera que responda. Sin usuario: los brokers solo son alcanzables
#  desde la red interna de compose (ver README §7).
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BROKERS}
# Nombre del cliente en los logs de los brokers y en Kafka UI.
spring.kafka.client-id=biblioteca-backend

# --- Productor (RelayKafka) ---
# acks=all: el broker lider responde cuando TODAS las replicas sincronizadas
# tienen el registro. Con min.insync.replicas=2 (en cada topico), se puede
# caer un broker sin perder una escritura confirmada.
spring.kafka.producer.acks=all
# Idempotencia: si el productor reintenta un envio por un timeout, el broker
# descarta el duplicado. Conserva el orden por particion con hasta 5 envios
# en vuelo.
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
# Agrupar 5 ms y comprimir: menos peticiones y menos disco con el mismo volumen.
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.compression-type=lz4
# Kafka caido: fallar rapido (5 s esperando metadatos, 10 s en total por
# envio) en vez del minuto por defecto. El relay devuelve el lote a la tabla
# y lo reintenta en la siguiente vuelta.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
# Clave texto (id del libro o de la solicitud) y valor JSON. La cabecera de
# tipo lleva un nombre corto, no la clase Java: el consumidor la traduce con
# la misma tabla.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=\
  cambioStock:cl.duoc.biblioteca.streaming.CambioStock,\
  hechoSolicitud:cl.duoc.biblioteca.streaming.HechoSolicitud

# --- Consumidores (@KafkaListener) ---
# ErrorHandlingDeserializer envuelve al JSON: un registro ilegible no rompe el
# bucle del consumidor; llega al manejador de errores, que lo manda a la DLT
# (streaming/ConfigKafka). Solo se aceptan tipos del paquete streaming.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.biblioteca.streaming
spring.kafka.consumer.properties.spring.json.type.mapping=\
  cambioStock:cl.duoc.biblioteca.streaming.CambioStock,\
  hechoSolicitud:cl.duoc.biblioteca.streaming.HechoSolicitud
# Un grupo nuevo empieza por el registro mas antiguo, no por el siguiente.
spring.kafka.consumer.auto-offset-reset=earliest
# El offset lo confirma el contenedor de Spring DESPUES de procesar cada
# registro (ack-mode=record), nunca un temporizador del cliente: lo
# confirmado esta procesado.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Rebalanceo cooperativo: si entra o sale un consumidor del grupo, solo se
# mueven las particiones que cambian de dueno; las demas siguen consumiendo.
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
# Hilos por grupo (uno por particion).
biblioteca.kafka.concurrencia=3

# --- Administracion (KafkaAdmin crea los topicos al arrancar) ---
# 10 s y no 30: si los brokers aun no responden, la API arranca igual y
# AseguradorTopicos lo reintenta despues.
spring.kafka.admin.operation-timeout=10s
biblioteca.kafka.relay=PT1S
biblioteca.kafka.espera-envio=PT10S

# --- Los topicos (streaming/TopologiaKafka). Cada uno ajustado a su flujo. ---
# biblioteca.inventario: el ULTIMO stock de cada libro. compact = Kafka borra,
# con el tiempo, los registros viejos de una clave y deja el ultimo; no se
# borra por antiguedad. segment.ms de 1 h para que la compactacion se note
# (solo compacta segmentos cerrados); min.compaction.lag.ms protege 1 min a
# los recien llegados; delete.retention.ms guarda 1 dia los tombstones.
biblioteca.kafka.inventario.particiones=3
biblioteca.kafka.inventario.replicas=3
biblioteca.kafka.inventario.configuracion[cleanup.policy]=compact
biblioteca.kafka.inventario.configuracion[min.insync.replicas]=2
biblioteca.kafka.inventario.configuracion[segment.ms]=3600000
biblioteca.kafka.inventario.configuracion[min.compaction.lag.ms]=60000
biblioteca.kafka.inventario.configuracion[delete.retention.ms]=86400000
# biblioteca.solicitudes: HISTORIA de hechos. delete por antiguedad a los 30
# dias (2592000000 ms): cubre un prestamo largo y deja reconstruir la
# bandeja; mas, seria guardar datos que nadie lee.
biblioteca.kafka.solicitudes.particiones=3
biblioteca.kafka.solicitudes.replicas=3
biblioteca.kafka.solicitudes.configuracion[cleanup.policy]=delete
biblioteca.kafka.solicitudes.configuracion[retention.ms]=2592000000
biblioteca.kafka.solicitudes.configuracion[min.insync.replicas]=2
# *.dlt: lo que no se pudo procesar, 14 dias (1209600000 ms) para revisarlo.
biblioteca.kafka.dlt.particiones=3
biblioteca.kafka.dlt.replicas=3
biblioteca.kafka.dlt.configuracion[cleanup.policy]=delete
biblioteca.kafka.dlt.configuracion[retention.ms]=1209600000
biblioteca.kafka.dlt.configuracion[min.insync.replicas]=2

# El cliente de Kafka imprime su configuracion completa (cien lineas) por cada
# productor, consumidor y admin que crea. En CloudWatch eso tapa todo lo demas.
logging.level.org.apache.kafka=WARN
