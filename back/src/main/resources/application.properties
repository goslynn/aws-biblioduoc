spring.application.name=biblioteca-backend

# Puerto por defecto de Spring Boot. Es el que publica el contenedor en la EC2
# y al que apunta el target group del NLB (aws/backend.yaml).
server.port=8080

# NOTA sobre fechas: Spring Boot 4 usa Jackson 3, que ya serializa java.time
# como texto ISO-8601 ("2026-10-05T14:03:11Z") por defecto. La antigua
# propiedad spring.jackson.serialization.write-dates-as-timestamps ya no
# existe y, si se deja puesta, el contexto de Spring NI SIQUIERA ARRANCA.

# En un error, devolver el mensaje ayuda a diagnosticar desde Bruno y desde el
# navegador. En produccion real esto se apaga para no filtrar detalles internos.
server.error.include-message=always

# ---------------------------------------------------------------------------
#  Seguridad. Estos valores NO se escriben en el repositorio: los escribe el
#  UserData de aws/backend.yaml en el archivo de entorno del contenedor, a
#  partir de los Outputs de cognito.yaml y web.yaml.
#
#    BIBLIOTECA_ISSUER          el emisor exigido en el claim "iss" (Cognito)
#    BIBLIOTECA_JWKS            las claves publicas de Cognito, en JSON; las
#                               descarga aws/pipeline/build-backend.sh
#    BIBLIOTECA_SCOPE           el scope de acceso (estudiantes)
#    BIBLIOTECA_SCOPE_GESTION   el scope del cliente M2M backoffice (empleado)
#    BIBLIOTECA_ORIGEN          el origen del frontend
#    BIBLIOTECA_USER_POOL_ID    el pool donde se lee el email verificado
# ---------------------------------------------------------------------------
biblioteca.scope-gestion=${BIBLIOTECA_SCOPE_GESTION}
biblioteca.cognito.user-pool-id=${BIBLIOTECA_USER_POOL_ID}

# El grupo de Cognito cuyos miembros son empleados (cognito.yaml).
biblioteca.grupo-empleados=empleados

# ---------------------------------------------------------------------------
#  Base de datos (PostgreSQL en RDS, privada). Tambien llega por variables de
#  entorno; las contrasenas las lee la EC2 de Secrets Manager (secretos de
#  aws/database.yaml) cada vez que arranca el contenedor:
#
#    SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD   rol biblioteca_app: lo que
#                                                    usa la aplicacion
#    SPRING_FLYWAY_USER / _PASSWORD                  usuario maestro: SOLO para
#                                                    las migraciones al arrancar
#    BIBLIOTECA_APP_PASSWORD                         la misma de biblioteca_app,
#                                                    para que V1 cree el rol
# ---------------------------------------------------------------------------

# Un solo proceso atiende peticiones, consumidores y tareas periodicas. 8
# conexiones alcanzan de sobra y quedan lejos del limite de una db.t3.micro.
spring.datasource.hikari.maximum-pool-size=8

# Si la base no responde (por ejemplo, RDS todavia arrancando al reabrir el
# lab), fallar en 5 s con un error claro en vez de colgar la peticion.
spring.datasource.hikari.connection-timeout=5000

# La contrasena del rol biblioteca_app, para el CREATE ROLE de V1. Se lee de
# una variable propia y no de SPRING_FLYWAY_PLACEHOLDERS_..., porque al pasar
# por una variable de entorno Spring pondria la clave del placeholder en
# minusculas ("apppassword") y Flyway ya no la encontraria.
spring.flyway.placeholders.appPassword=${BIBLIOTECA_APP_PASSWORD}

# ---------------------------------------------------------------------------
#  RabbitMQ. Corre en la MISMA EC2, en otro contenedor de la misma red de
#  Docker: RABBITMQ_HOST es el nombre de ese contenedor. Usuario y contrasena
#  salen del secreto RabbitSecret (aws/backend.yaml).
# ---------------------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Publisher confirms: el broker confirma cada publicacion. RelayEventos y
# PublicadorCorreo esperan esa confirmacion antes de dar algo por publicado.
spring.rabbitmq.publisher-confirm-type=simple

# ---------------------------------------------------------------------------
#  Correo (SMTP). El proveedor se elige al desplegar (SMTP_HOST...); la
#  contrasena sale del secreto SmtpSecret (aws/backend.yaml).
#  587 + STARTTLS obligatorio: el puerto 25 esta bloqueado en EC2, y sin TLS
#  la contrasena viajaria en claro.
# ---------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
biblioteca.correo.remitente=${SMTP_FROM}

# Reintentos del envio: max-intentos vueltas por correo.espera, que retiene
# cada correo espera-reintento antes de devolverlo. OJO: espera-reintento es
# un argumento de la cola; cambiarlo con la cola ya creada hace fallar el
# arranque (PRECONDITION_FAILED) hasta borrarla. Ver aws/README.md §8.
biblioteca.correo.max-intentos=3
biblioteca.correo.espera-reintento=PT60S

# Recordatorio de vencimiento: cuanto antes avisar y cada cuanto revisar.
# BIBLIOTECA_RECORDATORIO_ANTELACION permite acortar la espera en una demo
# (por ejemplo PT23H58M: un prestamo de 1 dia avisa a los 2 minutos).
biblioteca.recordatorio.antelacion=${BIBLIOTECA_RECORDATORIO_ANTELACION:PT24H}
biblioteca.recordatorio.revision=PT1M
