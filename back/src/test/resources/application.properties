# Valores de mentira para los tests. En AWS los inyecta aws/backend.yaml desde
# los Outputs de cognito.yaml y web.yaml; aqui solo hacen falta para que el
# contexto de Spring levante. Ningun test llega a usar el JwtDecoder de verdad:
# la autenticacion se simula con el post-processor jwt() de spring-security-test,
# y por eso tampoco hay ninguna llamada de red.
biblioteca.issuer=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_pruebas
biblioteca.scope=biblioteca-api/acceso
biblioteca.scope-gestion=biblioteca-api/gestion
biblioteca.grupo-empleados=empleados
biblioteca.origen=https://203.0.113.10.sslip.io

# Una clave RSA PUBLICA generada para los tests (la privada se descarto): solo
# sirve para que JwtDecoder pueda construirse como en AWS.
biblioteca.jwks={"keys":[{"kty":"RSA","alg":"RS256","use":"sig","kid":"clave-de-pruebas","e":"AQAB","n":"uoOfA9qTjX-jh5ib30-WUVWIYijkZeNCfYoz_NDzD2Q9FghQdOsCWQ17gOe1lAHpN5H5n9y2NI1wmll2HSOd52xMdhBxqPreZO3eiMInB5pmi3M2npSLyTVkp96_J0a4ZsLuRosmvwapIQEMjNV5vro0Do8ek7sFbBLiG7HJpkt2s-I9Xw1OudwACiOnM-B4M0Ndn4-8b5lvlJGZAaJM34EXlUKz3I00gYEUDCak-bzhGxjecyMGPWVGxhqr3cWLBZGy3F-57uL0N-J2rpWNMD8uQoP02G7MR60VAoNiFk8Gs-_inE_hbM21YrIuagxmZ4scZszQaQT4rM51VY5eOQ"}]}

# Contrasena del rol biblioteca_app dentro del Postgres de Testcontainers, que
# solo existe mientras corren los tests. Ver PostgresDePrueba.
# (Este archivo REEMPLAZA al application.properties principal, no se suma a
# el: por eso hay que repetir aqui la propiedad del placeholder.)
spring.flyway.placeholders.appPassword=clave-de-pruebas

# Broker y SMTP los ponen ServiciosDePrueba (RabbitMQ en Docker, GreenMail en
# memoria). Aqui va lo que no depende del contenedor.
spring.rabbitmq.publisher-confirm-type=simple

# El host del SMTP tiene que estar aqui y no en ServiciosDePrueba: Spring
# decide si crea el JavaMailSender mirando esta propiedad ANTES de que los
# contenedores de prueba registren las suyas. El puerto si llega despues.
spring.mail.host=127.0.0.1
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
biblioteca.correo.remitente=biblioteca@prueba.cl
biblioteca.correo.max-intentos=3

# Reintentos y relay rapidos: los tests no pueden esperar un minuto por vuelta.
biblioteca.correo.espera-reintento=PT1S
biblioteca.eventos.relay=PT0.2S

# El programador de recordatorios lo llaman los tests a mano.
biblioteca.recordatorio.antelacion=PT24H
biblioteca.recordatorio.revision=PT1H
