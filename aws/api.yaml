AWSTemplateFormatVersion: "2010-09-09"

# ==============================================================================
#  biblioteca / api.yaml   --   API Gateway REST API + authorizer Cognito + CORS
# ==============================================================================
#
#  QUE HACE
#    Publica el backend en internet y lo protege. Es la pieza que une
#    cognito.yaml con backend.yaml, y la unica puerta legitima a la aplicacion.
#    * VpcLink -> el tunel privado de API Gateway hasta el NLB interno de
#                 backend.yaml. La EC2 no tiene ningun puerto abierto a
#                 Internet: el unico camino es este.
#
#  POR QUE REST API (v1) Y NO HTTP API (v2)
#    Cuidado con el argumento facil, porque es falso: el HTTP API SI admite
#    scopes por ruta (AuthorizationScopes en su authorizer JWT), y ademas los
#    distingue mejor que esta plantilla, porque responde 401 cuando el token no
#    valida y 403 cuando valida pero le faltan los scopes. Lo que da la REST API
#    a cambio de mas lineas es otra cosa:
#      * authorizer de tipo COGNITO_USER_POOLS, atado al User Pool, en vez de un
#        authorizer JWT generico,
#      * GatewayResponses, que el HTTP API no tiene, y que son los que hacen
#        VISIBLE un 401 en el navegador (ver el reparto del CORS, mas abajo),
#      * metodos OPTIONS escritos a mano, con integracion MOCK,
#      * el paso explicito de "desplegar al stage", que en HTTP API no existe
#        porque se despliega solo.
#    El coste de la decision es justo lo que se mide abajo: aqui un token sin el
#    scope tambien recibe 401. (Y el VPC Link de una REST API exige un NLB; el
#    de una HTTP API aceptaria un ALB.)
#
#  EL CAMINO DE UNA PETICION
#    GET /test/api/libros  +  Authorization: Bearer <access_token>
#      +-> ¿existe el recurso?            si no -> 403 "Missing Authentication Token"
#      +-> Authorizer COGNITO_USER_POOLS  firma/emisor/expiracion malas -> 401
#      +-> AuthorizationScopes            token sin NINGUNO de los scopes -> 401
#          MEDIDO, y no es lo que documenta AWS: el authorizer de User Pools
#          responde 401, con el mismo cuerpo generico que ante un token
#          invalido. Ver README.md §4.
#      +-> Integracion HTTP_PROXY por el VPC Link -> NLB interno -> EC2:8080
#      +-> Tomcat -> Spring Security (2a validacion, y el ROL) -> el controlador
#
#  >>> DOS SCOPES, Y QUIEN DECIDE QUE <<<
#    Todos los metodos aceptan "acceso" (estudiantes y empleados) O "gestion"
#    (el cliente backoffice). El gateway solo responde a "¿este token es para
#    esta API?". Que un estudiante no pueda aprobar solicitudes lo decide
#    SPRING por la ruta /api/gestion/**: el 403 de RBAC sale de la aplicacion,
#    y es el primero de la matriz que se ve A TRAVES del gateway.
#
#  >>> POR QUE EXIGIR UN SCOPE OBLIGA A USAR EL ACCESS TOKEN <<<
#    Cuando un metodo declara AuthorizationScopes, API Gateway exige que el
#    token traiga el claim "scope". Un ID TOKEN no lo lleva nunca, por diseno
#    de OIDC. Resultado: el id_token deja de pasar sin configurar nada mas.
#
#  >>> EL REPARTO DEL CORS, QUE AQUI NO ES OBVIO <<<
#    Con integracion HTTP_PROXY, API Gateway NO anade cabeceras a la respuesta
#    real: lo que sale es tal cual lo devolvio la EC2. Asi que el CORS se
#    reparte en TRES piezas, y hacen falta las tres:
#
#      1. El preflight OPTIONS  -> lo responde este stack con integracion MOCK.
#         Nunca lleva Authorization, por eso su AuthorizationType es NONE.
#      2. La respuesta REAL 2xx -> la cabecera Allow-Origin la pone SPRING
#         (corsConfigurationSource, variable BIBLIOTECA_ORIGEN).
#      3. Los errores del propio gateway (401/403, que nunca llegan a la
#         EC2) -> GatewayResponses DEFAULT_4XX y DEFAULT_5XX. Sin esto, el
#         navegador muestra "status 0 / blocked by CORS" en vez del 401 real, y
#         el resto del laboratorio deja de ser diagnosticable.
#
#  TRAMPAS
#    * Las cabeceras de CORS son EXPRESIONES: una cadena literal se escribe con
#      comillas simples dentro de las dobles -> "'https://...'". Es el error
#      tipografico mas comun de esta plantilla.
#    * En HTTP_PROXY los path parameters NO viajan solos: cada {id} o {proxy}
#      de la Uri necesita su integration.request.path.X. Sin el, la EC2 recibe
#      literalmente "/api/libros/{id}".
#    * El VPC Link tarda varios minutos en quedar AVAILABLE; el primer
#      despliegue del stack espera por el.
#    * Si el NLB no tiene ningun destino sano (la app arrancando, o caida),
#      API Gateway responde 500 "Internal server error". Mira los health
#      checks del target group antes de mirar el codigo.
#    * AWS::ApiGateway::Deployment es INMUTABLE: si cambias un metodo,
#      CloudFormation actualiza el metodo pero el stage sigue sirviendo lo
#      viejo. Por eso el pipeline ejecuta siempre aws/pipeline/api-deploy.sh
#      despues de actualizar este stack.
#    * Al OPTIONS nunca se le pone authorizer: el preflight responderia 401 y
#      el navegador ni siquiera intentaria la peticion real.
#
#  DEPENDE DE
#    * cognito.yaml -> UserPoolArn, ScopeCompleto, ScopeGestion
#    * backend.yaml -> NlbArn, NlbDnsName
#    * web.yaml     -> SiteOrigin (para el CORS)
#
#  ENTREGA (Outputs)
#    ApiEndpoint -> el frontend y Bruno
#    ApiId       -> aws/pipeline/api-deploy.sh
#
#  DESPLIEGUE MANUAL
#    aws cloudformation deploy \
#      --template-file aws/api.yaml \
#      --stack-name biblioteca-api \
#      --parameter-overrides \
#        ProjectName=biblioteca UserPoolArn=... NlbArn=... NlbDnsName=... \
#        RequiredScope=biblioteca-api/acceso ManagementScope=biblioteca-api/gestion \
#        AllowOrigin=https://biblioteca-web-<ACCOUNT>.s3.us-east-1.amazonaws.com
#    ...y despues, SIEMPRE:  ./aws/pipeline/api-deploy.sh
# ==============================================================================

Description: >-
  biblioteca - API Gateway REST API con authorizer COGNITO_USER_POOLS, scopes
  exigidos por metodo, VPC Link hacia el NLB interno, CORS manual y stage
  desplegable. Depende de cognito.yaml, backend.yaml y web.yaml.

Parameters:

  ProjectName:
    Type: String
    Default: biblioteca
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Prefijo de nombres. Debe coincidir con el de los demas stacks.

  UserPoolArn:
    Type: String
    AllowedPattern: "^arn:aws:cognito-idp:.+$"
    Description: Output "UserPoolArn" de cognito.yaml. Es el ProviderARN del authorizer.

  NlbArn:
    Type: String
    AllowedPattern: "^arn:aws:elasticloadbalancing:.+$"
    Description: Output "NlbArn" de backend.yaml. Destino del VPC Link.

  NlbDnsName:
    Type: String
    Description: Output "NlbDnsName" de backend.yaml. Host de las URI de integracion.

  RequiredScope:
    Type: String
    Default: biblioteca-api/acceso
    Description: >-
      Output "ScopeCompleto" de cognito.yaml. Un token valido SIN este scope
      (ni el de gestion) recibe 401 (medido; ver la cabecera). Debe ser
      identico al que exige Spring.

  ManagementScope:
    Type: String
    Default: biblioteca-api/gestion
    Description: Output "ScopeGestion" de cognito.yaml. El del cliente backoffice.

  AllowOrigin:
    Type: String
    Description: >-
      Origen del navegador autorizado (esquema + host, SIN barra final ni
      ruta): normalmente el Output "SiteOrigin" de web.yaml. El navegador
      compara este valor con su cabecera Origin caracter por caracter.

  StageName:
    Type: String
    Default: test
    AllowedPattern: "^[a-zA-Z0-9-_]+$"
    Description: >-
      Nombre del stage; aparece como primer segmento de la URL publica
      (.../test/api/libros). "test" es el que usa la guia del curso.

Resources:

  # ===========================================================================
  #  LA API, SU TUNEL Y SU ARBOL DE RECURSOS
  # ===========================================================================
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-rest-api"
      Description: API interna de la Biblioteca Duoc (catalogo y solicitudes).
      EndpointConfiguration:
        # REGIONAL: la API vive en una region. EDGE la pondria detras de
        # CloudFront, que aqui solo anadiria latencia de propagacion al
        # desplegar y ningun beneficio.
        Types:
          - REGIONAL

  # /api
  ResourceApi:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: api

  # /api/libros
  ResourceLibros:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ResourceApi
      PathPart: libros

  # /api/libros/{id}   -> tambien atiende /api/libros/generos y
  #                       /api/libros/avisame: para API Gateway son un valor
  #                       mas de {id}, y es Spring quien decide que ese
  #                       literal lo atiende otro metodo.
  ResourceLibroItem:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ResourceLibros
      PathPart: "{id}"

  # /api/solicitudes
  ResourceSolicitudes:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ResourceApi
      PathPart: solicitudes

  # /api/solicitudes/{id}
  ResourceSolicitudItem:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ResourceSolicitudes
      PathPart: "{id}"

  # /api/libros/{id}/avisame
  ResourceLibroAvisame:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ResourceLibroItem
      PathPart: avisame

  # /api/avisos
  ResourceAvisos:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ResourceApi
      PathPart: avisos

  # /api/avisos/correo
  ResourceAvisosCorreo:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ResourceAvisos
      PathPart: correo

  # /api/gestion
  ResourceGestion:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ResourceApi
      PathPart: gestion

  # /api/gestion/{proxy+}
  ResourceGestionProxy:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ResourceGestion
      PathPart: "{proxy+}"

  # /v1
  ResourceV1:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: v1

  # /v1/{proxy+}
  #  El versionado (Fase 14 del plan) se resuelve con UN recurso proxy en vez
  #  de repetir los cuatro recursos de arriba. Lo importante del versionado no
  #  es la URL bonita: es poder enrutar /v1 y /v2 a integraciones DISTINTAS sin
  #  romper a los clientes existentes. Con este proxy, el dia que haya un /v2
  #  basta con otro recurso apuntando a otro destino.
  ResourceV1Proxy:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ResourceV1
      PathPart: "{proxy+}"

  # ---------------------------------------------------------------------------
  #  EL VPC LINK. API Gateway vive fuera de la VPC; esto le da una entrada
  #  privada (PrivateLink) hasta el NLB interno. Sin el, la unica forma de
  #  llegar a la EC2 seria darle un puerto publico.
  # ---------------------------------------------------------------------------
  VpcLink:
    Type: AWS::ApiGateway::VpcLink
    Properties:
      Name: !Sub "${ProjectName}-vpc-link"
      Description: API Gateway -> NLB interno -> EC2 de la aplicacion
      TargetArns:
        - !Ref NlbArn

  # ===========================================================================
  #  EL AUTHORIZER
  # ===========================================================================

  # De tipo COGNITO_USER_POOLS: API Gateway descarga el JWKS del pool y valida
  # firma, emisor y expiracion por su cuenta, SIN llegar a la EC2 (un 401 no
  # le cuesta nada al backend).
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      RestApiId: !Ref RestApi
      Name: !Sub "${ProjectName}-cognito"
      Type: COGNITO_USER_POOLS
      # De donde saca el token: la cabecera estandar Authorization: Bearer <jwt>
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !Ref UserPoolArn
      # IdentityValidationExpression se deja sin definir a proposito: filtraria
      # tokens por expresion regular ANTES de validarlos, y entonces un token
      # invalido daria 401 por el motivo equivocado.

  # ===========================================================================
  #  METODOS DE NEGOCIO
  #  Todos comparten el mismo destino (el NLB, por el VPC Link) y el mismo
  #  par (authorizer, scopes). Las rutas del estudiante se declaran una a una
  #  —y no con un proxy— para que esta plantilla documente exactamente que se
  #  expone: cualquier ruta no listada aqui ni siquiera llega a la EC2.
  #  IntegrationHttpMethod es el MISMO que el del cliente: con HTTP_PROXY se
  #  reenvia la peticion tal cual.
  # ===========================================================================

  # GET /api/libros -> LibroController.buscar()
  MethodLibrosGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceLibros
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: GET
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/libros"

  # GET /api/libros/{id} -> porId(), generos() y GET /api/libros/avisame (para el gateway, "generos" y "avisame" son un {id} mas)
  MethodLibroItemGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceLibroItem
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: GET
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/libros/{id}"
        RequestParameters:
          integration.request.path.id: method.request.path.id

  # POST /api/libros/{id}/avisame -> AvisameController.suscribir()
  MethodAvisamePost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceLibroAvisame
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: POST
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/libros/{id}/avisame"
        RequestParameters:
          integration.request.path.id: method.request.path.id

  # DELETE /api/libros/{id}/avisame -> AvisameController.cancelar()
  MethodAvisameDelete:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceLibroAvisame
      HttpMethod: DELETE
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: DELETE
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/libros/{id}/avisame"
        RequestParameters:
          integration.request.path.id: method.request.path.id

  # GET /api/solicitudes -> SolicitudController.listar() (solo las propias)
  MethodSolicitudesGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceSolicitudes
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: GET
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/solicitudes"

  # POST /api/solicitudes -> SolicitudController.crear()
  MethodSolicitudesPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceSolicitudes
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: POST
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/solicitudes"

  # GET /api/solicitudes/{id} -> SolicitudController.porId()
  MethodSolicitudItemGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceSolicitudItem
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: GET
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/solicitudes/{id}"
        RequestParameters:
          integration.request.path.id: method.request.path.id

  # GET /api/avisos/correo -> ContactoController.estado()
  MethodCorreoGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceAvisosCorreo
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: GET
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/avisos/correo"

  # PUT /api/avisos/correo -> ContactoController.activar() (el consentimiento)
  MethodCorreoPut:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceAvisosCorreo
      HttpMethod: PUT
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: PUT
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/avisos/correo"

  # DELETE /api/avisos/correo -> ContactoController.desactivar()
  MethodCorreoDelete:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceAvisosCorreo
      HttpMethod: DELETE
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: DELETE
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/avisos/correo"

  # ANY /api/gestion/{proxy+} -> GestionSolicitudController, GestionStockController, BitacoraController.
  #  Un proxy y no un recurso por ruta: aqui el gateway no puede aportar
  #  nada, porque el rol EMPLEADO solo lo conoce Spring.
  MethodGestionAny:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceGestionProxy
      HttpMethod: ANY
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/api/gestion/{proxy}"
        RequestParameters:
          integration.request.path.proxy: method.request.path.proxy

  # ANY /v1/{proxy+} -> las mismas rutas, bajo el prefijo versionado.
  MethodV1Any:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceV1Proxy
      HttpMethod: ANY
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      AuthorizationScopes:
        - !Ref RequiredScope
        - !Ref ManagementScope
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        ConnectionType: VPC_LINK
        ConnectionId: !Ref VpcLink
        Uri: !Sub "http://${NlbDnsName}/v1/{proxy}"
        RequestParameters:
          integration.request.path.proxy: method.request.path.proxy

  # ===========================================================================
  #  CORS, PIEZA 1: el preflight.
  #
  #  Antes de un GET con cabecera Authorization —o de cualquier POST con
  #  Content-Type: application/json— el navegador manda un OPTIONS "a ver si
  #  puedo". Ese OPTIONS:
  #    * NO lleva la cabecera Authorization (por especificacion), asi que
  #      AuthorizationType TIENE que ser NONE;
  #    * no necesita llegar a la EC2: se responde con integracion MOCK, que
  #      es un 200 fabricado por API Gateway sin backend detras.
  #
  #  Las cabeceras se declaran DOS veces: en IntegrationResponses (el valor) y
  #  en MethodResponses (el permiso para devolverlas). Faltando la segunda, el
  #  valor se descarta en silencio.
  # ===========================================================================

  MethodLibrosOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceLibros
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowOrigin}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Max-Age: "'600'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Max-Age: true

  MethodLibroItemOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceLibroItem
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowOrigin}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Max-Age: "'600'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Max-Age: true

  MethodAvisameOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResourceLibroAvisame
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
