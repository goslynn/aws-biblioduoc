AWSTemplateFormatVersion: "2010-09-09"

# ==============================================================================
#  biblioteca / artifacts.yaml   --   Bucket privado para los artefactos de build
# ==============================================================================
#
#  QUE HACE
#    * ArtifactsBucket -> bucket S3 PRIVADO y versionado donde los pipelines dejan
#                         el paquete del backend y el del sitio antes de
#                         publicar una version nueva.
#
#  EL FLUJO QUE HABILITA
#    1. aws/pipeline/build-backend.sh arma el paquete (.tar.gz con los jars).
#    2. Lo sube aqui con "s3 cp" (por partes) y lee su VersionId con head-object.
#       publish-web.sh hace lo mismo con el sitio, con "s3api put-object".
#    3. Le pide a la EC2 de backend.yaml (SSM Run Command) que anote ese
#       VersionId y reinicie la aplicacion.
#    4. Al arrancar, la EC2 LEE el paquete de este bucket con su perfil de
#       instancia (LabInstanceProfile / LabRole). En ningun momento del
#       proceso existe una Access Key estatica: solo credenciales temporales.
#
#  TRAMPAS
#    * Un bucket versionado guarda TODAS las versiones anteriores. El paquete
#      del backend pesa ~72 MB, asi que sin la regla de ciclo de vida el bucket
#      crece sin freno. La regla borra las versiones no vigentes a los 7 dias.
#    * CloudFormation NO puede borrar un bucket con objetos dentro. Por eso
#      aws/scripts/teardown.sh lo vacia (versiones y delete markers) primero.
#
#  DEPENDE DE
#    Nada. Es el primer stack que se despliega.
#
#  ENTREGA (Outputs)
#    ArtifactsBucketName -> build-backend.sh, publish-web.sh, backend.yaml y web.yaml
#
#  DESPLIEGUE MANUAL (bootstrap.sh ya lo hace por ti)
#    aws cloudformation deploy \
#      --template-file aws/artifacts.yaml \
#      --stack-name biblioteca-artifacts \
#      --parameter-overrides ProjectName=biblioteca
# ==============================================================================

Description: >-
  biblioteca - Bucket S3 privado y versionado para los artefactos de despliegue
  del backend. Sin dependencias.

Parameters:

  # Prefijo de todos los nombres del proyecto. bootstrap.sh lo pasa siempre.
  ProjectName:
    Type: String
    Default: biblioteca
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: Solo minusculas, numeros y guiones (va en el nombre del bucket).
    Description: Prefijo de nombres. Debe coincidir con el de los demas stacks.

  # Cuantos dias se conservan las versiones viejas del artefacto.
  RetencionVersionesDias:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 90
    Description: >-
      Dias que sobrevive una version NO vigente de un paquete antes de borrarse.
      7 basta para poder volver atras un despliegue fallido sin acumular GB.

Resources:

  # ---------------------------------------------------------------------------
  #  El bucket de artefactos.
  #  El nombre lleva el AccountId porque los nombres de bucket son unicos en
  #  TODO S3, no solo en la cuenta: sin el, chocarias con otro alumno. Ademas
  #  lo hace predecible, de modo que un script puede calcularlo sin leer el
  #  stack.
  # ---------------------------------------------------------------------------
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}"

      # Cada subida crea una version nueva. Eso da dos cosas: poder volver a un
      # paquete anterior, y un VersionId exacto que la EC2 descarga y deja
      # anotado (/etc/biblioteca/version): se sabe que version corre.
      VersioningConfiguration:
        Status: Enabled

      # Los artefactos NUNCA son publicos. Los cuatro flags cierran la puerta
      # tanto a ACLs como a politicas de bucket, presentes y futuras.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      # Cifrado en reposo con la clave gestionada por S3. Es gratis y evita la
      # observacion tipica de una auditoria.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      LifecycleConfiguration:
        Rules:
          # Limpia versiones viejas de los paquetes.
          - Id: BorrarVersionesAntiguas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref RetencionVersionesDias
          # Limpia subidas multiparte que quedaron a medias (una subida cortada
          # sigue ocupando y cobrando aunque no se vea en "s3 ls").
          - Id: AbortarSubidasIncompletas
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:

  # Lo consumen los pipelines (destino de la subida), backend.yaml y web.yaml (origen).
  ArtifactsBucketName:
    Description: Nombre del bucket de artefactos.
    Value: !Ref ArtifactsBucket

  ArtifactsBucketArn:
    Description: ARN del bucket, por si hace falta en una politica.
    Value: !GetAtt ArtifactsBucket.Arn
