AWSTemplateFormatVersion: "2010-09-09"

# ==============================================================================
#  biblioteca / backend.yaml   --   API, administrador y cluster RabbitMQ en una EC2, tras un NLB
# ==============================================================================
#
#  QUE HACE
#    * RabbitSecret     -> usuario y contrasena del broker, generados.
#    * ErlangCookieSecret -> el secreto con que los dos nodos forman el cluster.
#    * SmtpSecret       -> la contrasena del proveedor SMTP (parametro NoEcho).
#    * AppConfig        -> parametro de SSM con la configuracion NO secreta de
#                          la aplicacion, en formato "VARIABLE=valor".
#    * AppLogGroup      -> los logs de los cuatro contenedores, con caducidad.
#    * AppServer        -> Amazon Linux 2023 con Docker y docker compose, que
#                          levanta CUATRO contenedores (aws/backend/compose.yaml):
#                            rabbitmq-1, rabbitmq-2  cluster RabbitMQ 4.1 de dos nodos
#                            app           la API (back/), en Corretto 21
#                            admin-rabbit  el administrador de RabbitMQ (admin-rabbit/)
#    * Nlb + TargetGroup + Listener -> un Network Load Balancer INTERNO en las
#                          subredes privadas: es el destino del VPC Link de
#                          api.yaml. API Gateway no puede hablar con una IP de
#                          EC2; necesita un NLB delante.
#
#  >>> POR QUE EC2 Y NO LAMBDA <<<
#    RabbitMQ necesita consumidores que vivan SIEMPRE con una conexion
#    abierta (@RabbitListener) y tareas periodicas (el relay de la bandeja de
#    salida, los recordatorios). Una Lambda se congela entre peticiones, y
#    solo se dispara desde colas de Amazon MQ, que el Learner Lab NO permite
#    (mq:* con explicitDeny, medido). El broker tiene que ser autogestionado,
#    asi que va en EC2; y para no partir el backend en dos, la API va con el.
#
#  >>> COMO ARRANCA, Y POR QUE CADA ARRANQUE LEE TODO DE NUEVO <<<
#    El UserData (solo en el PRIMER arranque) instala Docker y el plugin de
#    compose, y deja UN servicio de systemd: biblioteca. Cada vez que arranca
#    —primer boot, reinicio, la sesion del lab que vuelve, o un despliegue de
#    build-backend.sh— su script (/opt/biblioteca/arrancar.sh):
#      1. baja el paquete del backend de S3 (jars + compose.yaml + rabbitmq.conf),
#      2. lee la configuracion de AppConfig (SSM),
#      3. lee los secretos de Secrets Manager (BD, RabbitMQ, cookie, SMTP),
#      4. los escribe en archivos de entorno en /run (tmpfs, permisos 600),
#         uno por tipo de contenedor (el administrador no ve la BD ni el SMTP),
#      5. y corre "docker compose up -d --wait".
#    Asi, cambiar un parametro de este stack y reiniciar el servicio basta:
#    no hace falta recrear la instancia. Y ninguna contrasena queda escrita en
#    el UserData, ni en la plantilla, ni en el disco.
#
#  >>> LA SEGUNDA VALIDACION DEL TOKEN SE CONFIGURA AQUI <<<
#    BIBLIOTECA_ISSUER, BIBLIOTECA_JWKS, BIBLIOTECA_SCOPE y
#    BIBLIOTECA_SCOPE_GESTION hacen que Spring Security valide el JWT por su
#    cuenta, ademas de API Gateway, y decida el rol EMPLEADO. Ningun
#    identificador de Cognito esta escrito en el repositorio.
#
#  >>> DOS USUARIOS DE BASE DE DATOS <<<
#    SPRING_FLYWAY_*      -> el MAESTRO, solo para las migraciones al arrancar.
#    SPRING_DATASOURCE_*  -> biblioteca_app, el que atiende las peticiones,
#                            con los permisos minimos de V1 y V3.
#
#  TRAMPAS
#    * HttpPutResponseHopLimit: 2. Con IMDSv2 y el limite por defecto (1), un
#      CONTENEDOR no alcanza el servicio de metadatos (el bridge de Docker es
#      un salto mas) y el SDK de la app se queda sin credenciales: el PUT de
#      activar avisos responderia 500 al llamar a Cognito.
#    * CreationPolicy: CloudFormation espera la senal de cfn-signal, que el
#      UserData manda cuando /health responde. Si en 20 min no llega, el stack
#      falla en vez de quedar "creado" con una aplicacion que no arranco. Para
#      ver por que: aws ec2 get-console-output --instance-id <id> --latest
#    * El NLB vive en dos AZ y la instancia en una: sin cross-zone, el nodo
#      del NLB en la otra AZ no tendria destino y la mitad de las peticiones
#      fallarian.
#    * Cambiar el UserData DETIENE y vuelve a arrancar la instancia, pero no
#      lo vuelve a ejecutar (cloud-init lo corre una vez). Por eso aqui solo
#      hay lo que no cambia; la configuracion vive en AppConfig y lo que
#      corre, en el paquete. Cuando el UserData SI tiene que cambiar (paso de
#      "docker run" a compose), se cambia el id logico de la instancia
#      (AppInstance -> AppServer): CloudFormation crea otra y borra la vieja.
#    * La IP publica cambia cada vez que el lab detiene la instancia. No
#      importa: nada entra por ella, y el NLB apunta al id de la instancia.
#    * Los volumenes rabbitmq-1-datos y rabbitmq-2-datos guardan el estado de
#      cada nodo (colas, mensajes, usuario, pertenencia al cluster).
#      RABBITMQ_DEFAULT_PASS solo se aplica al CREAR el cluster: si rotas
#      RabbitSecret, cambia la contrasena desde el panel o borra los volumenes.
#    * Con DOS nodos, una cola quorum necesita a los dos (mayoria de 2): si
#      cae uno, deja de aceptar mensajes hasta que vuelva. Es un cluster para
#      demostrar replicacion, no tolerancia a fallos (que pide tres).
#    * Docker compose se descarga de GitHub con version fija: la instancia
#      necesita salida 443 (la tiene, para S3, Secrets Manager y las imagenes).
#
#  DEPENDE DE
#    * artifacts.yaml -> ArtifactsBucketName, y el paquete ya SUBIDO
#    * cognito.yaml   -> IssuerUrl, ScopeCompleto, ScopeGestion, UserPoolId (+ JWKS)
#    * web.yaml       -> SiteOrigin (cabecera CORS de las respuestas reales)
#    * network.yaml   -> PublicSubnetId, AppSecurityGroupId, PrivateSubnetIds
#    * database.yaml  -> DbEndpoint, DbPort, DbName, MasterSecretArn, AppSecretArn
#
#  ENTREGA (Outputs)
#    NlbArn, NlbDnsName  -> api.yaml (VPC Link e integraciones)
#    InstanceId          -> build-backend.sh (reinicio por SSM tras desplegar)
#    TargetGroupArn      -> build-backend.sh (espera a que el NLB lo de por sano)
#    AppPrivateIp        -> vpn-up.sh y bruno-env.sh (paneles y administrador por el tunel)
#    RabbitSecretArn     -> vpn-up.sh (credenciales del panel)
#    LogGroupName        -> aws logs tail
#
#  DESPLIEGUE
#    ./aws/pipeline/build-backend.sh     (compila, sube el paquete y despliega)
# ==============================================================================

Description: >-
  biblioteca - EC2 con docker compose (cluster RabbitMQ de dos nodos, API y
  administrador de RabbitMQ), detras de un NLB interno para el VPC Link de
  API Gateway. Depende de artifacts, cognito, web,
  network y database.

Parameters:

  ProjectName:
    Type: String
    Default: biblioteca
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Prefijo de nombres. Debe coincidir con el de los demas stacks.

  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: >-
      Perfil de instancia de la EC2. En AWS Academy NO se pueden crear roles
      IAM, asi que se usa el preexistente LabInstanceProfile (rol LabRole). Le
      da a la instancia —y al SDK de la app— credenciales temporales, sin
      Access Keys: leer el paquete en S3, los secretos, SSM y Cognito.

  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.large]
    Description: >-
      Cuatro contenedores en una maquina: dos nodos RabbitMQ (Erlang) y dos
      JVM (API y administrador), ~3 GiB con los limites de compose.yaml.
      t3.medium (4 GiB) es el minimo; t3.small ya no alcanza.

  ImageId:
    # Se resuelve al desplegar desde el parametro publico que mantiene AWS:
    # siempre la ultima Amazon Linux 2023, sin escribir ningun AMI a mano.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AMI de la instancia (Amazon Linux 2023, que trae AWS CLI y el agente de SSM).

  AppPort:
    Type: Number
    Default: 8080
    Description: Puerto de Spring Boot. Debe coincidir con AppPort de network.yaml.

  ArtifactsBucketName:
    Type: String
    Description: Output "ArtifactsBucketName" de artifacts.yaml.

  ArtifactsObjectKey:
    Type: String
    Default: backend/biblioteca-backend.tar.gz
    Description: >-
      Ruta del paquete del backend dentro del bucket de artefactos: los dos
      fat jars (API y administrador), compose.yaml y la configuracion de
      RabbitMQ. Lo arma build-backend.sh.

  IssuerUrl:
    Type: String
    AllowedPattern: "^https://cognito-idp\\..+$"
    Description: >-
      Output "IssuerUrl" de cognito.yaml. Spring exige que el claim "iss" de
      cada token sea exactamente este valor.

  UserPoolId:
    Type: String
    Description: >-
      Output "UserPoolId" de cognito.yaml. La app lee de ahi el email
      verificado de quien activa los avisos (cognito-idp:ListUsers).

  JwksJson:
    Type: String
    AllowedPattern: "^\\{.*\"keys\".*\\}$"
    ConstraintDescription: Debe ser el JSON del JWKS de Cognito, con su array "keys".
    Description: >-
      Las claves PUBLICAS con que Cognito firma los tokens, tal como las sirve
      <IssuerUrl>/.well-known/jwks.json. Las descarga build-backend.sh. No es
      un secreto (por eso no lleva NoEcho): cualquiera puede descargarlas.

  RequiredScope:
    Type: String
    Default: biblioteca-api/acceso
    Description: >-
      Output "ScopeCompleto" de cognito.yaml: el scope de los estudiantes.
      Debe ser IDENTICO al de api.yaml.

  ManagementScope:
    Type: String
    Default: biblioteca-api/gestion
    Description: >-
      Output "ScopeGestion" de cognito.yaml: el del cliente M2M backoffice.
      Quien lo trae es EMPLEADO para Spring.

  WebOrigin:
    Type: String
    Description: >-
      Origen del frontend (Output "SiteOrigin" de web.yaml). Spring lo usa para
      poner la cabecera Access-Control-Allow-Origin en las respuestas REALES:
      con integracion HTTP_PROXY, API Gateway devuelve lo que diga la EC2.

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Output "PublicSubnetId" de network.yaml. Ahi vive la EC2.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Output "PrivateSubnetIds" de network.yaml. Ahi vive el NLB interno.

  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      Output "AppSecurityGroupId" de network.yaml. Entra solo el NLB; sale
      HTTPS, SMTP y Postgres.

  DbEndpoint:
    Type: String
    Description: Output "DbEndpoint" de database.yaml.

  DbPort:
    Type: Number
    Default: 5432
    Description: Output "DbPort" de database.yaml.

  DbName:
    Type: String
    Default: biblioteca
    Description: Output "DbName" de database.yaml.

  MasterSecretArn:
    Type: String
    AllowedPattern: "^arn:aws:secretsmanager:.+$"
    Description: Output "MasterSecretArn" de database.yaml. Solo lo usa Flyway.

  AppSecretArn:
    Type: String
    AllowedPattern: "^arn:aws:secretsmanager:.+$"
    Description: Output "AppSecretArn" de database.yaml. Rol biblioteca_app.

  SmtpHost:
    Type: String
    MinLength: 1
    Description: >-
      Servidor SMTP del proveedor de correo (smtp.gmail.com,
      smtp-relay.brevo.com...). Siempre por el 587 con STARTTLS: es lo que
      configura la aplicacion y lo unico que abre network.yaml. El 25 esta
      bloqueado en EC2, y sin TLS la contrasena viajaria en claro.

  SmtpUser:
    Type: String
    MinLength: 1
    Description: Usuario SMTP (en Gmail, la direccion; en Brevo, el login del relay).

  SmtpPassword:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: >-
      Contrasena SMTP (en Gmail, una contrasena de aplicacion). NoEcho: no se
      muestra en la consola ni en describe-stacks. Va a SmtpSecret.

  SmtpFrom:
    Type: String
    MinLength: 3
    Description: Remitente de los correos. Muchos proveedores exigen que sea una direccion verificada.

  ReminderLead:
    Type: String
    Default: PT24H
    AllowedPattern: "^PT[0-9HMS]+$"
    Description: >-
      Con cuanta antelacion al vencimiento se recuerda (duracion ISO-8601).
      Para una demo, PT23H58M hace que un prestamo de 1 dia avise a los 2 min.

Resources:

  # ===========================================================================
  #  SECRETOS Y CONFIGURACION
  # ===========================================================================

  # Credenciales del broker. Las conocen los nodos, la API y el administrador
  # (y quien abra el panel por la VPN, leyendolas de aqui).
  RabbitSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Usuario de RabbitMQ (broker de la EC2 de la aplicacion).
      GenerateSecretString:
        SecretStringTemplate: '{"username": "biblioteca"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # La Erlang cookie: el secreto compartido con que los DOS nodos de RabbitMQ
  # se reconocen como del mismo cluster (y con el que entra rabbitmqctl).
  # Texto plano, sin JSON. Nunca sale de la EC2 de la aplicacion.
  ErlangCookieSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Erlang cookie del cluster RabbitMQ (dos nodos en la EC2 de la aplicacion).
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # La contrasena SMTP, tal cual (texto plano, no JSON: puede traer comillas).
  SmtpSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Contrasena del proveedor SMTP de los avisos por correo.
      SecretString: !Ref SmtpPassword
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  #  La configuracion NO secreta de la app, una variable por linea. La leen
  #  los scripts de arranque de la EC2 en CADA arranque (ver la cabecera).
  #  Las lineas SECRETO_* son ARN de secretos, no secretos: el script las
  #  resuelve y no las pasa al contenedor.
  #
  #  Cabe de sobra en los 4 KB de un parametro estandar: lo mas largo es el
  #  JWKS (~1 KB).
  # ---------------------------------------------------------------------------
  AppConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/backend/app.env"
      Type: String
      Description: Configuracion no secreta del backend (formato VARIABLE=valor).
      Value: !Sub |
        AWS_REGION=${AWS::Region}
        BIBLIOTECA_ISSUER=${IssuerUrl}
        BIBLIOTECA_JWKS=${JwksJson}
        BIBLIOTECA_SCOPE=${RequiredScope}
        BIBLIOTECA_SCOPE_GESTION=${ManagementScope}
        BIBLIOTECA_USER_POOL_ID=${UserPoolId}
        BIBLIOTECA_ORIGEN=${WebOrigin}
        BIBLIOTECA_RECORDATORIO_ANTELACION=${ReminderLead}
        SPRING_DATASOURCE_URL=jdbc:postgresql://${DbEndpoint}:${DbPort}/${DbName}?sslmode=verify-full&sslrootcert=/opt/biblioteca/rds-ca.pem
        RABBITMQ_ADDRESSES=rabbitmq-1:5672,rabbitmq-2:5672
        SMTP_HOST=${SmtpHost}
        SMTP_PORT=587
        SMTP_USER=${SmtpUser}
        SMTP_FROM=${SmtpFrom}
        SECRETO_APP=${AppSecretArn}
        SECRETO_MASTER=${MasterSecretArn}
        SECRETO_RABBIT=${RabbitSecret}
        SECRETO_SMTP=${SmtpSecret}
        SECRETO_COOKIE=${ErlangCookieSecret}
        ARTEFACTO_BUCKET=${ArtifactsBucketName}
        ARTEFACTO_KEY=${ArtifactsObjectKey}
      Tags:
        Project: !Ref ProjectName

  # Los logs de los cuatro contenedores (driver awslogs de Docker), con caducidad.
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/backend"
      RetentionInDays: 7

  # ===========================================================================
  #  LA INSTANCIA
  # ===========================================================================

  # Antes se llamaba AppInstance (dos "docker run" con systemd). El id logico
  # se cambio A PROPOSITO al pasar a docker compose: el UserData nuevo solo
  # corre en una instancia NUEVA, y un id nuevo es lo que hace que
  # CloudFormation la cree, mueva el target group a ella y borre la vieja, sin
  # tocar el NLB ni el VPC Link de api.yaml. Ver TRAMPAS en la cabecera.
  AppServer:
    Type: AWS::EC2::Instance
    # Sin DependsOn: el UserData referencia AppConfig y AppLogGroup, y eso ya
    # obliga a crearlos antes del primer arranque.
    CreationPolicy:
      ResourceSignal:
        Count: 1
        # Instalar Docker y compose, bajar dos imagenes y formar el cluster.
        Timeout: PT20M
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      # AWS Academy: el perfil se recibe, no se crea.
      IamInstanceProfile: !Ref InstanceProfileName
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref PublicSubnetId
          # IP publica SOLO para salir (SMTP, imagenes, S3...). El security
          # group no acepta nada desde Internet.
          AssociatePublicIpAddress: true
          GroupSet: [!Ref AppSecurityGroupId]
      # IMDSv2 obligatorio, con 2 saltos para que los contenedores lleguen.
      # Ver TRAMPAS en la cabecera.
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-backend"
        - Key: Project
          Value: !Ref ProjectName
      # -----------------------------------------------------------------------
      #  PRIMER ARRANQUE. CloudFormation sustituye lo que va entre ${}; las
      #  variables de bash van SIN llaves ($VAR) para que no las confunda con
      #  las suyas. Todo lo que cambia entre despliegues se lee de AppConfig.
      # -----------------------------------------------------------------------
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/biblioteca-arranque.log | logger -t biblioteca -s 2>/dev/console) 2>&1

          dnf install -y -q docker jq aws-cfn-bootstrap
          systemctl enable --now docker
          # docker compose (plugin v2): Amazon Linux 2023 no lo trae en dnf.
          # Version FIJA, del release oficial de Docker.
          install -d -m 755 /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64
          chmod 755 /usr/local/lib/docker/cli-plugins/docker-compose
          install -d -m 755 /opt/biblioteca /etc/biblioteca
          install -d -m 700 /run/biblioteca

          # --- funciones comunes ------------------------------------------------
          cat > /opt/biblioteca/comun.sh <<'EOF'
          REGION=${AWS::Region}
          GRUPO_LOGS=${AppLogGroup}
          PARAMETRO=${AppConfig}
          # Configuracion no secreta, en formato VARIABLE=valor (AppConfig).
          CONFIG="$(aws ssm get-parameter --name "$PARAMETRO" --region "$REGION" --query Parameter.Value --output text)"
          valor() { grep "^$1=" <<<"$CONFIG" | cut -d= -f2-; }
          secreto() { aws secretsmanager get-secret-value --secret-id "$1" --region "$REGION" --query SecretString --output text; }
          install -d -m 700 /run/biblioteca
          umask 077
          EOF

          # --- El arranque: paquete + entorno + docker compose ------------------
          #  Baja el paquete del pipeline (la version que dejo build-backend.sh
          #  en /etc/biblioteca/version, o la vigente): los dos jars,
          #  compose.yaml, rabbitmq.conf y enabled_plugins. Baja la CA de RDS,
          #  arma los archivos de entorno con la configuracion y los secretos,
          #  y levanta los cuatro contenedores (ver aws/backend/compose.yaml).
          cat > /opt/biblioteca/arrancar.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          source /opt/biblioteca/comun.sh
          VERSION="$(cat /etc/biblioteca/version 2>/dev/null || true)"
          if [ -n "$VERSION" ]; then
            aws s3api get-object --bucket "$(valor ARTEFACTO_BUCKET)" --key "$(valor ARTEFACTO_KEY)" \
              --version-id "$VERSION" --region "$REGION" /opt/biblioteca/paquete.tar.gz >/dev/null
          else
            aws s3 cp "s3://$(valor ARTEFACTO_BUCKET)/$(valor ARTEFACTO_KEY)" /opt/biblioteca/paquete.tar.gz --region "$REGION" --only-show-errors
          fi
          rm -rf /opt/biblioteca/paquete
          install -d -m 755 /opt/biblioteca/paquete
          tar -xzf /opt/biblioteca/paquete.tar.gz -C /opt/biblioteca/paquete
          curl -fsS -o /opt/biblioteca/rds-ca.pem "https://truststore.pki.rds.amazonaws.com/$REGION/$REGION-bundle.pem"
          chmod -R a+rX /opt/biblioteca/paquete
          chmod 644 /opt/biblioteca/rds-ca.pem

          APP="$(secreto "$(valor SECRETO_APP)")"
          MAESTRO="$(secreto "$(valor SECRETO_MASTER)")"
          RABBIT="$(secreto "$(valor SECRETO_RABBIT)")"
          SMTP="$(secreto "$(valor SECRETO_SMTP)")"
          COOKIE="$(secreto "$(valor SECRETO_COOKIE)")"
          RABBIT_USER="$(jq -r .username <<<"$RABBIT")"
          RABBIT_PASS="$(jq -r .password <<<"$RABBIT")"

          # Los dos nodos: el usuario inicial y la Erlang cookie con la que se
          # reconocen entre si (y con la que entra rabbitmqctl).
          {
            echo "RABBITMQ_DEFAULT_USER=$RABBIT_USER"
            echo "RABBITMQ_DEFAULT_PASS=$RABBIT_PASS"
            echo "RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-setcookie $COOKIE"
            echo "RABBITMQ_CTL_ERL_ARGS=-setcookie $COOKIE"
          } > /run/biblioteca/rabbitmq.env

          # La API: todo.
          {
            grep -v -e '^SECRETO_' -e '^ARTEFACTO_' <<<"$CONFIG"
            echo "SPRING_DATASOURCE_USERNAME=$(jq -r .username <<<"$APP")"
            echo "SPRING_DATASOURCE_PASSWORD=$(jq -r .password <<<"$APP")"
            echo "BIBLIOTECA_APP_PASSWORD=$(jq -r .password <<<"$APP")"
            echo "SPRING_FLYWAY_USER=$(jq -r .username <<<"$MAESTRO")"
            echo "SPRING_FLYWAY_PASSWORD=$(jq -r .password <<<"$MAESTRO")"
            echo "RABBITMQ_USER=$RABBIT_USER"
            echo "RABBITMQ_PASSWORD=$RABBIT_PASS"
            echo "SMTP_PASSWORD=$SMTP"
          } > /run/biblioteca/app.env

          # El administrador: solo Cognito (validar el JWT) y RabbitMQ.
          {
            grep -e '^AWS_REGION=' -e '^BIBLIOTECA_ISSUER=' -e '^BIBLIOTECA_JWKS=' \
                 -e '^BIBLIOTECA_SCOPE=' -e '^BIBLIOTECA_SCOPE_GESTION=' -e '^RABBITMQ_ADDRESSES=' <<<"$CONFIG"
            echo "RABBITMQ_USER=$RABBIT_USER"
            echo "RABBITMQ_PASSWORD=$RABBIT_PASS"
          } > /run/biblioteca/admin-rabbit.env

          export AWS_REGION="$REGION" GRUPO_LOGS APP_PUERTO=${AppPort}
          exec docker compose -p biblioteca -f /opt/biblioteca/paquete/compose.yaml \
            up -d --remove-orphans --wait --wait-timeout 600
          EOF
          chmod 755 /opt/biblioteca/*.sh

          # --- Un servicio: arranca en cada boot y relee todo ------------------
          #  oneshot: arrancar.sh termina cuando compose deja todo en marcha.
          #  Los reinicios de un contenedor caido los hace Docker
          #  (restart: unless-stopped); este servicio rehace el entorno y el
          #  paquete en cada arranque y en cada "systemctl restart biblioteca"
          #  que manda build-backend.sh por SSM.
          cat > /etc/systemd/system/biblioteca.service <<'EOF'
          [Unit]
          Description=Biblioteca: cluster RabbitMQ, API y administrador (docker compose)
          After=docker.service network-online.target
          Wants=network-online.target
          Requires=docker.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/opt/biblioteca/arrancar.sh
          ExecStop=/usr/bin/docker compose -p biblioteca -f /opt/biblioteca/paquete/compose.yaml down
          TimeoutStartSec=900
          Restart=on-failure
          RestartSec=20
          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now biblioteca

          # --- Senal para CloudFormation: lista cuando /health responde --------
          OK=1
          for i in $(seq 1 80); do
            if curl -fs http://127.0.0.1:${AppPort}/health >/dev/null; then OK=0; break; fi
            sleep 10
          done
          /opt/aws/bin/cfn-signal -e $OK --stack ${AWS::StackName} --resource AppServer --region ${AWS::Region}

  # ===========================================================================
  #  EL BALANCEADOR: lo que permite a API Gateway llegar a la EC2
  # ===========================================================================

  # Interno: solo tiene IPs privadas. El unico que le habla es el VPC Link.
  Nlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-nlb"
      Type: network
      Scheme: internal
      Subnets: !Ref PrivateSubnetIds
      LoadBalancerAttributes:
        # Ver TRAMPAS: la instancia esta en una sola AZ.
        - Key: load_balancing.cross_zone.enabled
          Value: "true"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # El NLB solo manda trafico a la instancia mientras /health responde 2xx.
  # TCP hacia el puerto de la app; el health check, en cambio, es HTTP.
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-app"
      VpcId: !GetAtt AppServer.VpcId
      Protocol: TCP
      Port: !Ref AppPort
      TargetType: instance
      Targets:
        - Id: !Ref AppServer
          Port: !Ref AppPort
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckPort: !Ref AppPort
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        # Al reiniciar la app, no esperar 5 min a que se vacien conexiones.
        - Key: deregistration_delay.timeout_seconds
          Value: "15"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Nlb
      Protocol: TCP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:

  NlbArn:
    Description: ARN del NLB interno. Destino del VPC Link de api.yaml.
    Value: !Ref Nlb

  NlbDnsName:
    Description: Nombre DNS del NLB. Va en las URI de las integraciones de api.yaml.
    Value: !GetAtt Nlb.DNSName

  InstanceId:
    Description: La EC2. build-backend.sh reinicia su servicio por SSM tras subir un paquete nuevo.
    Value: !Ref AppServer

  TargetGroupArn:
    Description: Target group del NLB. build-backend.sh espera a que la instancia este sana.
    Value: !Ref TargetGroup

  AppPrivateIp:
    Description: >-
      IP privada de la EC2. Por la VPN: paneles de RabbitMQ en :15672 y :15673,
      administrador de RabbitMQ en :8081. La usan vpn-up.sh y bruno-env.sh.
    Value: !GetAtt AppServer.PrivateIp

  RabbitSecretArn:
    Description: Credenciales del broker (y del panel). Las lee vpn-up.sh.
    Value: !Ref RabbitSecret

  LogGroupName:
    Description: "Seguir los logs: aws logs tail <este valor> --follow"
    Value: !Ref AppLogGroup
