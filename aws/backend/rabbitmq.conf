# ==============================================================================
#  biblioteca / aws/backend/rabbitmq.conf   --   El cluster de dos nodos
# ==============================================================================
#
#  Se monta en /etc/rabbitmq/conf.d/20-cluster.conf de LOS DOS nodos
#  (compose.yaml): se SUMA a la configuracion por defecto de la imagen
#  (10-defaults.conf), no la reemplaza.
#
#  COMO SE FORMA EL CLUSTER
#    classic_config: la lista de miembros esta escrita aqui. En el primer
#    arranque (volumenes vacios) cada nodo busca a los de la lista; uno forma
#    el cluster y el otro se une. En los arranques siguientes cada nodo
#    recuerda su cluster (lo guarda en su volumen) y esta lista ya no se usa.
#
#    El nombre de un nodo es rabbit@<hostname>: por eso compose.yaml fija
#    hostname: rabbitmq-1 / rabbitmq-2. Con un hostname aleatorio, el nodo
#    cambiaria de nombre en cada arranque y perderia sus datos.
#
#    Los dos nodos se autentican entre si con la Erlang cookie, que NO esta
#    aqui: la genera aws/backend.yaml (ErlangCookieSecret) y llega a cada
#    contenedor al arrancar.
# ==============================================================================

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# ------------------------------------------------------------------------------
#  Colas quorum en los DOS nodos.
#
#  Una quorum nace con tantos miembros como nodos ve el broker al declararla.
#  Si la API la declara justo cuando el segundo nodo todavia se esta uniendo,
#  nace con uno solo. La reconciliacion continua la corrige: cada cierto
#  tiempo anade replicas hasta llegar a target_group_size.
#
#  OJO: con DOS nodos, una quorum necesita a los dos para tener mayoria (2 de
#  2). Si cae uno, la cola deja de aceptar escrituras hasta que vuelva. La
#  tolerancia a fallos real empieza en tres nodos. Declarado en README §7.
# ------------------------------------------------------------------------------
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 2
