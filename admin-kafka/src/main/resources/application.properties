spring.application.name=biblioteca-admin-kafka

# Puerto propio: en la EC2 corre al lado de la API (8080) y de admin-rabbit
# (8081). Se publica solo hacia la VPC; desde fuera se llega por la VPN.
server.port=8082

# Los 400, 404 y 409 explican que paso; aqui no hay nada interno que esconder.
server.error.include-message=always

# ---------------------------------------------------------------------------
#  Seguridad: las MISMAS variables que la API (aws/backend.yaml las escribe
#  en el archivo de entorno del contenedor). Ver ValidacionJwt.
#    BIBLIOTECA_ISSUER, BIBLIOTECA_JWKS, BIBLIOTECA_SCOPE, BIBLIOTECA_SCOPE_GESTION
# ---------------------------------------------------------------------------
biblioteca.scope-gestion=${BIBLIOTECA_SCOPE_GESTION}
biblioteca.grupo-empleados=empleados

# ---------------------------------------------------------------------------
#  Kafka: los tres brokers (aws/backend/kafka.compose.yaml). Si uno cae, el
#  cliente sigue con los otros dos.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BROKERS}
spring.kafka.admin.client-id=biblioteca-admin-kafka
# Una respuesta del cluster tarda milisegundos; 15 s es que algo esta caido (503).
admin.kafka.espera=PT15S
logging.level.org.apache.kafka=WARN

# ---------------------------------------------------------------------------
#  Lo que este servicio NO puede borrar, ni cambiarle particiones ni
#  cleanup.policy: los topicos que declara la API
#  (back/.../streaming/TopologiaKafka.java). Si se agrega un topico alli, se
#  agrega aqui. Los internos de Kafka ("__*") estan protegidos siempre.
# ---------------------------------------------------------------------------
admin.kafka.protegidos=\
  biblioteca.inventario,biblioteca.solicitudes,\
  biblioteca.inventario.dlt,biblioteca.solicitudes.dlt

# Las claves de configuracion de topico que se pueden fijar por REST: las que
# deciden cuanto se guarda, como se limpia y cuanta replicacion se exige.
admin.kafka.configuraciones-permitidas=\
  cleanup.policy,retention.ms,retention.bytes,\
  segment.ms,segment.bytes,\
  delete.retention.ms,min.compaction.lag.ms,\
  min.insync.replicas,max.message.bytes,compression.type
