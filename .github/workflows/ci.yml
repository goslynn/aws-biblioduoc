# ==============================================================================
#  ci.yml   --   Compila y prueba en cada push a main y en cada pull request
# ==============================================================================
#  No usa ningun secreto ni toca AWS: funciona aunque el lab este abajo. Lo que
#  despliega es despliegue.yml.
# ==============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Los tests levantan PostgreSQL y RabbitMQ con Testcontainers: el runner
      # ya trae Docker.
      - run: ./mvnw -B package

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json
      # Los dos archivos que en un despliegue genera publish-web.sh.
      - run: |
          cp src/app/aws-config.example.ts src/app/aws-config.ts
          cp src/app/diagnostico/rutas.example.ts src/app/diagnostico/rutas.ts
      - run: npm ci
      - run: npm run build
